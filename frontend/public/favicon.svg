<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#161e2e"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Mortarboard top (diamond shape) -->
  <polygon points="16,7 27,12 16,17 5,12" fill="url(#cap)" filter="url(#glow)"/>

  <!-- Cap body (cylinder) -->
  <ellipse cx="16" cy="17" rx="5.5" ry="2.2" fill="url(#cap)" opacity="0.85"/>
  <rect x="10.5" y="17" width="11" height="4" fill="url(#cap)" opacity="0.85"/>
  <ellipse cx="16" cy="21" rx="5.5" ry="2.2" fill="#a371f7" opacity="0.75"/>

  <!-- Tassel string -->
  <line x1="27" y1="12" x2="27" y2="19" stroke="#a371f7" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="27" cy="20.5" r="1.8" fill="#a371f7" filter="url(#glow)"/>

  <!-- AI sparkle bottom-right -->
  <circle cx="22" cy="26" r="1" fill="#58a6ff" opacity="0.9"/>
  <circle cx="25" cy="25" r="0.6" fill="#a371f7" opacity="0.7"/>
  <circle cx="24" cy="28" r="0.6" fill="#58a6ff" opacity="0.6"/>
</svg>
