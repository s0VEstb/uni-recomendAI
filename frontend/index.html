<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Uni RecomendAI — умный подбор университетов Кыргызстана на основе ваших интересов, балла ОРТ и бюджета. Бесплатный ИИ-навигатор для абитуриентов." />
    <meta name="theme-color" content="#0f1419" />
    <title>Uni RecomendAI — подбор вуза по ОРТ и интересам</title>

    <!-- Favicons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect для ускорения загрузки шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DM Sans (основной шрифт) + Inter (для числовых данных) -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Тема применяется до рендера React, чтобы избежать мигания -->
    <script>
      (function(){
        var t = localStorage.getItem('uni-theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
